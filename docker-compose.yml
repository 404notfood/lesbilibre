services:
  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME}-nginx
    ports:
      - "80:80"
      - "443:443"
      - "6001:6001"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - php
      - node
    networks:
      - app-network
    restart: unless-stopped
    env_file:
      - .env2

  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: ${PROJECT_NAME}-php
    volumes:
      - .:/var/www/html
    environment:
      - PHP_MAIL_HOST=mailpit
      - PHP_MAIL_PORT=1025
    depends_on:
      - mysql
      - redis
    networks:
      - app-network
    restart: unless-stopped
    env_file:
      - .env2

  node:
    build:
      context: .
      dockerfile: node/Dockerfile
    container_name: ${PROJECT_NAME}-node
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - ./certbot/conf:/etc/letsencrypt:ro
    environment:
      - NODE_ENV=development
    depends_on:
      - mysql
      - redis
    networks:
      - app-network
    restart: unless-stopped
    env_file:
      - .env2

  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: ${PROJECT_NAME}-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    env_file:
      - .env2

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
    env_file:
      - .env2

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${PROJECT_NAME}-phpmyadmin
    ports:
      - "${PMA_PORT:-8082}:80"
    environment:
      PMA_HOST: mysql
    networks:
      - app-network
    restart: unless-stopped
    env_file:
      - .env2

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${PROJECT_NAME}-mailpit
    ports:
      - "${MAILPIT_SMTP:-1025}:1025"
      - "${MAILPIT_UI:-8025}:8025"
    networks:
      - app-network
    restart: unless-stopped

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    container_name: ${PROJECT_NAME}-soketi
    expose:
      - "6001"
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-lesbi-app}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-lesbi-key}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-lesbi-secret}
      SOKETI_DEBUG: "1"
    networks:
      - app-network
    restart: unless-stopped
    env_file:
      - .env2

  certbot:
    image: certbot/certbot:latest
    container_name: ${PROJECT_NAME}-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait ${!}; done;'"

volumes:
  mysql-data:
  redis-data:
  node-modules:

networks:
  app-network:
    driver: bridge
