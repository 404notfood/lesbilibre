name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP, React and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lesbilibre_testing
          MYSQL_ROOT_PASSWORD: testing_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptesting_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Format PHP
        run: |
          vendor/bin/pint
          git diff --exit-code

      - name: Check TypeScript
        run: npm run types

      - name: Lint JavaScript and TypeScript
        run: npm run lint:check

      - name: Build production assets
        run: npm run build

      - name: Check PWA cache, notifications and updates
        run: npm run test:pwa

      - name: Run the test suite
        run: php artisan test

      - name: Check distance queries on isolated MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lesbilibre_testing
          DB_USERNAME: root
          DB_PASSWORD: testing_only
        run: php artisan test --filter=SearchDistanceTest
