name: Quality checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, pdo_sqlite, bcmath, gd
          coverage: none
      - uses: actions/cache@v4
        with:
          path: site/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('site/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run types
      - run: npm run build
