upstream php-fpm {
    server php:9000;
}

upstream node-app {
    server node:3000;
}

upstream soketi {
    server soketi:6001;
}

server {
    listen 80;
    server_name lesbi.test;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name lesbi.test;

    ssl_certificate /etc/letsencrypt/live/lesbi.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lesbi.test/privkey.pem;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --- Hide server info ---
    server_tokens off;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Vite HMR WebSocket proxy (dev mode)
    location /@vite/ {
        proxy_pass http://node-app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Deny access to hidden files (.env, .git, .htaccess, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }
}

# WebSocket proxy (wss://lesbi.test:6001 -> ws://soketi:6001)
server {
    listen 6001 ssl;
    server_name lesbi.test;

    ssl_certificate /etc/letsencrypt/live/lesbi.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lesbi.test/privkey.pem;

    location / {
        proxy_pass http://soketi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
